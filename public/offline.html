<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sedang offline — MoodJourney</title>
    <style>
        :root { --bg:#f8f7fb; --text:#24232a; --muted:#6d6b78; --primary:#6d5ce8; --on:#fff; }
        @media (prefers-color-scheme: dark) { :root { --bg:#14131a; --text:#ecebf3; --muted:#a9a7b8; --primary:#9a8cff; --on:#17151f; } }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box;
               background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; text-align:center; }
        main { max-width:420px; }
        .emoji { font-size:56px; margin:0; }
        h1 { margin:12px 0 8px; font-size:26px; letter-spacing:-0.02em; }
        p { color:var(--muted); line-height:1.6; }
        button { margin-top:12px; min-height:46px; padding:0 22px; border:0; border-radius:12px; background:var(--primary);
                 color:var(--on); font:inherit; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>
<main>
    <p class="emoji" aria-hidden="true">📡</p>
    <h1>Kamu sedang offline</h1>
    <p>MoodJourney butuh internet untuk memuat catatanmu. Datamu aman. Coba lagi saat koneksi sudah kembali.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
